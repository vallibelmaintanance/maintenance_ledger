<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maintenance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: an engineering drawing sheet. A title block on top, ledger tables below,
   thin ruled borders, mono figures, one navy/teal system that matches the printed PDF forms. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F4F7FA; --ink:#13202D; --muted:#566677; --line:#C7D1DB;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --teal:#2E7D8C; --plan:#CBE5EA; --plan-ink:#1F5E6B;
  --ok:#2B7A4B; --ok-bg:#DCEFE3; --warn:#8F6208; --warn-bg:#F7EACA; --bad:#B03A2E; --bad-bg:#F6DBD7;
  --c1:#1F3A5F; --c2:#2E7D8C; --c3:#C98A2B; --c4:#8A5CA8; --c5:#7C8B99;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#151F2A; --surface2:#1A2633; --ink:#E4EBF1; --muted:#90A2B3; --line:#2A3947;
  --accent:#3A68A3; --accent-ink:#FFFFFF; --teal:#5BB4C4; --plan:#1F4852; --plan-ink:#9FD8E3;
  --ok:#6CC490; --ok-bg:#183626; --warn:#E3B04E; --warn-bg:#3B2E10; --bad:#EE8A7F; --bad-bg:#43211D;
  --c1:#7FA9DD; --c2:#5BB4C4; --c3:#E0A94A; --c4:#B58AD0; --c5:#8B9BAA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#151F2A; --surface2:#1A2633; --ink:#E4EBF1; --muted:#90A2B3; --line:#2A3947;
  --accent:#3A68A3; --accent-ink:#FFFFFF; --teal:#5BB4C4; --plan:#1F4852; --plan-ink:#9FD8E3;
  --ok:#6CC490; --ok-bg:#183626; --warn:#E3B04E; --warn-bg:#3B2E10; --bad:#EE8A7F; --bad-bg:#43211D;
  --c1:#7FA9DD; --c2:#5BB4C4; --c3:#E0A94A; --c4:#B58AD0; --c5:#8B9BAA; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--cond);letter-spacing:.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.right{text-align:right}

/* title block */
.tb{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(110px,1fr));margin-top:16px;
  border:1.5px solid var(--accent);background:var(--surface)}
.tb>div{padding:8px 12px;border-left:1px solid var(--line);min-width:0}
.tb>div:first-child{border-left:0;background:var(--accent);color:var(--accent-ink)}
.tb .k{display:block;font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.tb h1{font-size:25px;font-weight:700;line-height:1.1;margin-top:3px}
.tb .v{font-weight:600;overflow-wrap:anywhere}
.tb select{border:0;background:transparent;font-weight:600;padding:0;margin:0;max-width:100%}
.tb select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;border-bottom:1.5px solid var(--accent);scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--surface2);color:var(--muted);
  padding:9px 14px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--accent);border-bottom:1.5px solid var(--surface);font-weight:600}
.tab:focus-visible,.btn:focus-visible,.cell:focus-visible,.link:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.badge{font:600 11px/1 var(--mono);padding:3px 6px;border-radius:9px;background:var(--bad-bg);color:var(--bad)}
.badge.n{background:var(--warn-bg);color:var(--warn)}

main{background:var(--surface);border:1.5px solid var(--accent);border-top:0;padding:18px;min-height:360px}
.sec-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h h2{font-size:20px;font-weight:600}
.sec-h p{margin:2px 0 0;color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500;border-radius:3px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ro .w{display:none!important}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:500;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.tile{border:1px solid var(--line);padding:10px 12px;background:var(--surface2);min-width:0}
.tile .k{font:500 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .n{font:600 24px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.alert .n{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.panel{border:1px solid var(--line);padding:12px 14px;min-width:0}
.panel h3{font-size:15px;font-weight:600;margin-bottom:8px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.tb{grid-template-columns:1fr 1fr}.tb>div:first-child{grid-column:1/-1}.tb>div:nth-child(3){border-left:0}}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.band td{background:var(--accent);color:var(--accent-ink);font:600 12px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px}
tfoot td{font-weight:600;background:var(--surface2);border-top:1.5px solid var(--accent)}
.tag{font:500 12px var(--mono);color:var(--muted)}
.chip{display:inline-block;font:600 11px/1 var(--mono);padding:4px 7px;border-radius:3px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.ex{font:600 9.5px var(--mono);border:1px solid var(--warn);color:var(--warn);border-radius:2px;padding:1px 4px;margin-left:6px;vertical-align:middle}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;margin-bottom:14px;color:var(--ink)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}

/* PPM grid */
.ppm th.m,.ppm td.m{width:42px;min-width:42px;text-align:center;padding:3px}
.ppm td.m{border-left:1px solid var(--line)}
.ppm .pd{font:9px/1 var(--mono,monospace);color:var(--mute,#6b7a8a);margin-top:2px}
.plandates{display:grid;gap:4px;max-height:240px;overflow:auto;padding:2px}.pdrow{display:grid;grid-template-columns:92px 1fr 22px 1fr;gap:6px;align-items:center}.pdrow b{font-weight:600;font-size:12px}
.ppm td.t{min-width:220px}
.cell{width:34px;height:30px;border:1px solid transparent;background:var(--plan);color:var(--plan-ink);font:600 12px var(--mono);cursor:pointer;border-radius:2px}
.cell.old{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cell.due{background:var(--surface);border:2px solid var(--teal);color:var(--teal)}
.cell.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.cell.late{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:10px 0 0;align-items:center}
.legend .cell{width:22px;height:20px;font-size:10px;cursor:default;pointer-events:none}

/* bars */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;background:var(--surface2);border:1px solid var(--line)}
.bar .fl{height:100%;background:var(--c2)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block}
svg .ax{fill:var(--muted);font:11px var(--mono)}
svg .gl{stroke:var(--line);stroke-width:1}

/* forms + modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.55)}
.sheet{position:relative;background:var(--surface);border:1.5px solid var(--accent);width:min(640px,100%);margin-top:4vh}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--accent);color:var(--accent-ink)}
.sheet-h h2{font-size:17px}
.x{background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.sheet-b{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.f{display:grid;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font:500 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);padding:7px 8px;border-radius:2px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.months label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);padding:4px 6px;font-size:13px}
.sheet-f{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line)}
.sheet-f .sp{margin-right:auto}
.err{grid-column:1/-1;color:var(--bad);font-weight:500}
@media (max-width:560px){.sheet-b{grid-template-columns:minmax(0,1fr)}.months{grid-template-columns:repeat(4,1fr)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:3px;z-index:60;font-weight:500;max-width:90vw}
#toast[hidden]{display:none}
#toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.fl{transition:width .3s}}

:root{--c6:#3F8F5B;--c7:#B4574B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c6:#6CC490;--c7:#EE8A7F}}
:root[data-theme="dark"]{--c6:#6CC490;--c7:#EE8A7F}
#gate[hidden],#root[hidden]{display:none}
.gate{max-width:420px;margin:12vh auto 0;border:1.5px solid var(--accent);background:var(--surface)}
.gate .gh{background:var(--accent);color:var(--accent-ink);padding:14px 18px}
.gate .gh .k{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.gate .gh h1{font-size:24px;margin-top:3px}
.gate form{display:grid;gap:12px;padding:18px}
.gate p{margin:0;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
.dl dt{font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.prog{height:14px;background:var(--surface2);border:1px solid var(--line);position:relative}
.prog>i{display:block;height:100%;background:var(--teal)}
.prog-l{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted);margin-top:4px}
.stack{display:grid;gap:18px;margin-top:18px}
.back{margin-bottom:10px}
</style>
</head>
<body>

<div id="gate" class="wrap" hidden></div>
<div class="wrap" id="root">
  <header class="tb" id="tb"></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SYSTEMS=['Chiller plant & cooling towers','Chiller Mgmt System (CMS)','AHU, FCU & ventilation','Split AC','MSB & electrical','Generator','Fire protection','Water supply & pumps','Washrooms & sensor fixtures','Passenger & service lifts','Car lifts & stackers','Auditorium & sound','Civil, marble & roofing','Other'];
const TYPES=['PPM task','AMC visit','Corrective work','Improvement / project','Other'];
const FREQS=['Monthly','Quarterly','6-Monthly','Yearly','Custom'];
const BYS=['In-house','AMC','Sub-con'];
const CATS=[['amc','AMC fees'],['planned','Planned maintenance'],['breakdown','Breakdown repairs'],['corrective','Corrective works'],['improve','Improvements & other']];
const COLS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const EXP_CATS=['AMC payment','Spares & materials','Contractor / service','Consumables','Energy & fuel','Statutory & inspection','Other'];
const EXP_COLS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const PAY=['Unpaid','Part paid','Paid'];
const DEF_LISTS={systems:[...SYSTEMS],by:[...BYS],cats:[...EXP_CATS]};
function syncLists(){
  const S=state.settings,g=(k)=>Array.isArray(S[k])&&S[k].length?S[k]:DEF_LISTS[k];
  SYSTEMS.splice(0,SYSTEMS.length,...g('systems'));BYS.splice(0,BYS.length,...g('by'));
  const cats=[...g('cats')];state.expenses.forEach(e=>{if(e.category&&!cats.includes(e.category))cats.push(e.category)});
  EXP_CATS.splice(0,EXP_CATS.length,...cats);EXP_COLS.splice(0,EXP_COLS.length,...cats.map((_,i)=>`var(--c${i%7+1})`))}
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const NOW=new Date(), TODAY=ymd(NOW), THIS_Y=NOW.getFullYear(), THIS_M=NOW.getMonth();

const state={settings:{building:'',company:'',preparedBy:'',currency:'LKR',trackingStart:''},
  schedule:[],amc:[],breakdowns:[],jobs:[],expenses:[],loaded:{},db:null,canWrite:true,mode:'local',session:null,amcDetail:null,expF:{cat:'all',status:'all',month:'all'},
  year:THIS_Y,view:'overview',bdFilter:'open',jobType:'all',jobMonth:'all',sysFilter:'all',
  rep:{type:'month',month:0,quarter:1},ppmYear:THIS_Y,yearUser:false};

/* ---------- helpers ---------- */
const cur=()=>state.settings.currency||'';
const money=n=>(Math.round(+n||0)).toLocaleString('en-US');
const m2=n=>`${cur()} ${money(n)}`;
const total=o=>(+o.labour||0)+(+o.material||0)+(+o.contractor||0);
const kfmt=n=>n>=1e6?(n/1e6).toFixed(n%1e6?1:0)+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
const dshow=s=>{if(!s)return '';const[y,m,d]=s.slice(0,10).split('-');return `${d} ${MN[+m-1]} ${y}`};
const dtshow=s=>s?`${dshow(s)}${s.length>10?' '+s.slice(11,16):''}`:'';
const stripId=o=>{const c={...o};delete c.id;return c};
const trackedFrom=()=>{const t=state.settings.trackingStart;return t?t.slice(0,7)+'-01':''};
const tasksOf=y=>state.schedule.filter(t=>t.year===y);
const exCount=()=>state.jobs.filter(x=>x.example).length+state.breakdowns.filter(x=>x.example).length;
const exBadge=o=>o.example?'<span class="ex">EX</span>':'';
const sevClass=p=>p==='High'?'bad':p==='Medium'?'warn':'mute';
function monthsFor(freq,start){start=+start||0;
  if(freq==='Monthly')return[...Array(12).keys()];
  if(freq==='Quarterly')return[0,1,2,3].map(k=>(start%3)+3*k);
  if(freq==='6-Monthly')return[start%6,(start%6)+6];
  if(freq==='Yearly')return[start%12];return[]}
function nextRef(prefix,list,year){
  const re=new RegExp('^'+prefix+'-'+year+'-(\\d+)$');let mx=0;
  list.forEach(o=>{const m=re.exec(o.ref||'');if(m)mx=Math.max(mx,+m[1])});
  return `${prefix}-${year}-${String(mx+1).padStart(3,'0')}`}
const hours=b=>b.reported&&b.restored?Math.max(0,(new Date(b.restored)-new Date(b.reported))/36e5):0;


const expBalance=e=>e.status==='Paid'?0:e.status==='Part paid'?Math.max(0,(+e.amount||0)-(+e.paidAmount||0)):(+e.amount||0);
const expPaid=e=>(+e.amount||0)-expBalance(e);
const expLate=e=>e.status!=='Paid'&&e.due&&e.due<TODAY;
function expSummary(rows){
  const byCat={};EXP_CATS.forEach(c=>byCat[c]={total:0,paid:0,balance:0,n:0});
  let total=0,paid=0,balance=0,late=0,lateAmt=0;
  rows.forEach(e=>{const c=byCat[e.category]||(byCat[e.category]={total:0,paid:0,balance:0,n:0}),a=+e.amount||0;
    c.total+=a;c.paid+=expPaid(e);c.balance+=expBalance(e);c.n++;total+=a;paid+=expPaid(e);balance+=expBalance(e);
    if(expLate(e)){late++;lateAmt+=expBalance(e)}});
  return{rows,total,paid,balance,late,lateAmt,byCat}}

/* ---------- financial year ---------- */
const fyM=()=>{const m=+state.settings.fyStart;return m>=1&&m<=12?m:4};            /* first month of the financial year, 1-12 */
const fyOf=d=>{if(!d)return 0;const y=+d.slice(0,4),m=+d.slice(5,7);return fyM()===1||m>=fyM()?y:y-1};
const fyLabel=y=>fyM()===1?String(y):`${y}/${String(y+1).slice(2)}`;
const fyFile=y=>fyLabel(y).replace('/','-');
const fyCur=()=>fyOf(TODAY);
function fyMonths(y){const o=[];for(let i=0;i<12;i++){const mm=fyM()-1+i;o.push({y:y+Math.floor(mm/12),m:mm%12})}return o}
const inFy=(d,y)=>fyOf(d)===+y;
const ymKey=({y,m})=>`${y}-${pad(m+1)}`;

/* ---------- period maths ---------- */
function range(p){
  const all=fyMonths(p.year);let ms,label;
  if(p.type==='month'){ms=[all[p.month]];label=`${MF[ms[0].m]} ${ms[0].y}`}
  else if(p.type==='quarter'){ms=all.slice((p.quarter-1)*3,(p.quarter-1)*3+3);label=`Q${p.quarter} ${fyM()===1?p.year:'FY '+fyLabel(p.year)} (${MN[ms[0].m]} - ${MN[ms[2].m]})`}
  else{ms=all;label=fyM()===1?`Year ${p.year}`:`Financial year ${fyLabel(p.year)} (${MN[ms[0].m]} ${ms[0].y} - ${MN[ms[11].m]} ${ms[11].y})`}
  const f=ms[0],l=ms[ms.length-1];
  return{ms,label,from:`${ymKey(f)}-01`,to:`${ymKey(l)}-${pad(new Date(l.y,l.m+1,0).getDate())}`}}
function amcShare(from,to){
  const ps=new Date(from),pe=new Date(to);
  return state.amc.filter(c=>c.start&&c.end&&+c.value>0).map(c=>{
    const s=new Date(c.start),e=new Date(c.end),os=Math.max(s,ps),oe=Math.min(e,pe);
    if(oe<os)return{c,amount:0};
    return{c,amount:c.value*(((oe-os)/864e5+1)/(((e-s)/864e5)+1))}})}
function ppmMonths(ms){
  const out={planned:0,done:0,overdue:0,by:{},late:[]};
  ms.forEach(({y,m})=>{const r=ppmStats(y,m,m);out.planned+=r.planned;out.done+=r.done;out.overdue+=r.overdue;out.late.push(...r.late.map(x=>({...x,y})));
    Object.entries(r.by).forEach(([k,v])=>{const b=out.by[k]||(out.by[k]={planned:0,done:0,overdue:0});b.planned+=v.planned;b.done+=v.done;b.overdue+=v.overdue})});
  return out}
const ppmElapsed=y=>ppmMonths(fyMonths(y).filter(x=>`${ymKey(x)}-01`<=TODAY));
function ppmStats(year,m0,m1){
  const ts=trackedFrom(),out={planned:0,done:0,overdue:0,by:{},late:[]};
  tasksOf(year).forEach(t=>(t.months||[]).forEach(m=>{
    if(m<m0||m>m1)return;
    if(ts&&`${year}-${pad(m+1)}-01`<ts)return;
    const isDone=!!(t.done&&t.done[m]),late=!isDone&&ymd(new Date(year,m+1,0))<TODAY;
    const b=out.by[t.system]||(out.by[t.system]={planned:0,done:0,overdue:0});
    out.planned++;b.planned++;
    if(isDone){out.done++;b.done++}else if(late){out.overdue++;b.overdue++;out.late.push({t,m})}}));
  return out}
function gather(p){
  const r=range(p);
  const jobs=state.jobs.filter(j=>j.date>=r.from&&j.date<=r.to).sort((a,b)=>a.date<b.date?-1:1);
  const bds=state.breakdowns.filter(b=>b.reported&&b.reported.slice(0,10)>=r.from&&b.reported.slice(0,10)<=r.to).sort((a,b)=>a.reported<b.reported?-1:1);
  const exps=state.expenses.filter(e=>e.date>=r.from&&e.date<=r.to).sort((a,b)=>a.date<b.date?-1:1);
  const cat={amc:0,planned:0,breakdown:0,corrective:0,improve:0},nat={labour:0,material:0,contractor:0,amc:0},sys={};
  const S=n=>sys[n]||(sys[n]={cost:0,bd:0,jobs:0});
  jobs.forEach(j=>{const c=catOfJob(j.type);cat[c]+=total(j);nat.labour+=+j.labour||0;nat.material+=+j.material||0;nat.contractor+=+j.contractor||0;const s=S(j.system||'Other');s.cost+=total(j);s.jobs++});
  bds.forEach(b=>{cat.breakdown+=total(b);nat.labour+=+b.labour||0;nat.material+=+b.material||0;nat.contractor+=+b.contractor||0;const s=S(b.system||'Other');s.cost+=total(b);s.bd++});
  amcShare(r.from,r.to).forEach(x=>{cat.amc+=x.amount;nat.amc+=x.amount;S(x.c.system||'Other').cost+=x.amount});
  const monthly=[];
  for(const {y:cy,m} of r.ms){
    const f=`${cy}-${pad(m+1)}-01`,t=`${cy}-${pad(m+1)}-${pad(new Date(cy,m+1,0).getDate())}`;
    const row={m,y:cy,amc:0,planned:0,breakdown:0,corrective:0,improve:0};
    state.jobs.filter(j=>j.date>=f&&j.date<=t).forEach(j=>row[catOfJob(j.type)]+=total(j));
    state.breakdowns.filter(b=>b.reported&&b.reported.slice(0,10)>=f&&b.reported.slice(0,10)<=t).forEach(b=>row.breakdown+=total(b));
    amcShare(f,t).forEach(x=>row.amc+=x.amount);
    row.total=row.amc+row.planned+row.breakdown+row.corrective+row.improve;monthly.push(row)}
  const down=bds.filter(b=>b.restored).reduce((s,b)=>s+hours(b),0);
  return{range:r,jobs,bds,exp:expSummary(exps),cat,nat,sys,monthly,down,total:Object.values(cat).reduce((a,b)=>a+b,0),
    open:bds.filter(b=>b.status!=='Closed').length,ppm:ppmMonths(r.ms)}}
function catOfJob(t){return t==='PPM task'||t==='AMC visit'?'planned':t==='Corrective work'?'corrective':'improve'}
function amcStatus(c){
  if(!c.contractor||!c.start||!c.end)return{k:'mute',t:'Details missing',d:null};
  const left=Math.ceil((new Date(c.end)-new Date(TODAY))/864e5);
  if(left<0)return{k:'bad',t:'Expired',d:left};
  if(left<=60)return{k:'warn',t:`Expires in ${left} d`,d:left};
  return{k:'ok',t:'Active',d:left}}
function amcVisits(c){
  const done=state.jobs.filter(j=>j.type==='AMC visit'&&j.amcId===c.id&&(!c.start||j.date>=c.start)&&(!c.end||j.date<=c.end)).length;
  let due=0;
  if(c.start&&c.end&&+c.visits>0){const s=new Date(c.start),e=new Date(c.end),n=new Date(TODAY),
    frac=Math.min(1,Math.max(0,(n-s)/Math.max(1,e-s)));due=Math.floor(c.visits*((e-s)/864e5/365)*frac+1e-9)}
  return{done,due}}

let raf=0;const render=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(doRender)};
function yearsList(){
  const s=new Set([fyCur()-1,fyCur(),fyCur()+1,state.year]);
  [...state.jobs.map(j=>fyOf(j.date)),...state.breakdowns.map(b=>fyOf((b.reported||'').slice(0,10))),...state.expenses.map(e=>fyOf(e.date))].forEach(y=>y&&s.add(y));
  s.delete(0);const lo=Math.min(...s),hi=Math.max(...s);for(let y=lo;y<=hi;y++)s.add(y);
  return[...s].sort((a,b)=>a-b)}

function stacked(labels,series,names,colors=COLS){
  const W=720,H=250,pl=48,pr=8,pt=10,pb=26,n=labels.length;
  const tots=labels.map((_,i)=>series.reduce((s,a)=>s+a[i],0));
  const mx0=Math.max(...tots,1),step0=Math.pow(10,Math.floor(Math.log10(mx0/4)));
  const step=[1,2,2.5,5,10].map(f=>f*step0).find(s=>s*4>=mx0)||step0*10,mx=step*4;
  const bw=(W-pl-pr)/n,w=Math.min(34,bw*.62);let g='';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${kfmt(step*i)}</text>`}
  labels.forEach((l,i)=>{const x=pl+bw*i+(bw-w)/2;let y=H-pb;
    series.forEach((a,k)=>{const h=a[i]/mx*(H-pt-pb);if(h<=0)return;y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${colors[k]}"><title>${esc(l)} - ${esc(names[k])}: ${money(a[i])}</title></rect>`});
    g+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly maintenance cost by category">${g}</svg>`}
const legendOf=(names,colors)=>`<div class="lg">${names.map((c,i)=>`<span><i style="background:${colors[i]}"></i>${esc(c)}</span>`).join('')}</div>`;
const legend=()=>legendOf(CATS.map(c=>c[1]),COLS);
function sysBars(sys,limit=8){
  const rows=Object.entries(sys).filter(([,v])=>v.cost>0).sort((a,b)=>b[1].cost-a[1].cost).slice(0,limit);
  if(!rows.length)return'<p class="muted">No costs recorded for this period.</p>';
  const mx=rows[0][1].cost;
  return`<div class="bars">${rows.map(([k,v])=>`<div class="bar"><span class="lab" title="${esc(k)}">${esc(k)}</span><span class="tr"><span class="fl" style="display:block;width:${(v.cost/mx*100).toFixed(1)}%"></span></span><span class="mono">${money(v.cost)}</span></div>`).join('')}</div>`}

function expDash(y,full){
  const yr=state.expenses.filter(e=>inFy(e.date,y)),A=expSummary(yr),n=yr.length,FM=fyMonths(y),FL=fyLabel(y);
  const prevRows=state.expenses.filter(e=>inFy(e.date,y-1)),prevTot=prevRows.reduce((t,e)=>t+(+e.amount||0),0);
  const chg=prevTot?((A.total-prevTot)/prevTot*100):null;
  const mk=FM.map(ymKey),mlab=FM.map(x=>MN[x.m]);
  const monthly=mk.map(k=>yr.filter(e=>e.date.slice(0,7)===k).reduce((t,e)=>t+(+e.amount||0),0));
  const peak=monthly.indexOf(Math.max(...monthly)),active=monthly.filter(v=>v>0).length;
  const series=EXP_CATS.map(c=>mk.map(k=>yr.filter(e=>e.category===c&&e.date.slice(0,7)===k).reduce((t,e)=>t+(+e.amount||0),0)));
  const agg=k=>{const o={};yr.forEach(e=>{const v=(e[k]||'').trim()||'(none)';(o[v]=o[v]||{cost:0}).cost+=(+e.amount||0)});return o};
  const bycat={};EXP_CATS.forEach(c=>{if(A.byCat[c].total>0)bycat[c]={cost:A.byCat[c].total}});

  const chgTxt=v=>v==null?'-':(v>0?'+':'')+v.toFixed(1)+'%';

async function renameEverywhere(k,from,to){
  const rw=async(coll,list,fn)=>{for(const r of list){const n=fn(r);if(n)await put(coll,r.id,{...stripId(r),...n})}};
  if(k==='systems'){for(const [c,l] of [['expenses',state.expenses],['jobs',state.jobs],['breakdowns',state.breakdowns],['amc',state.amc],['schedule',state.schedule]])await rw(c,l.filter(x=>x.system===from),()=>({system:to}))}
  else if(k==='by'){
    await rw('schedule',state.schedule.filter(x=>x.by===from||Object.values(x.done||{}).some(d=>d.by===from)),x=>{const nd={};Object.entries(x.done||{}).forEach(([m,d])=>nd[m]=d.by===from?{...d,by:to}:d);return{by:x.by===from?to:x.by,done:nd}});
    await rw('jobs',state.jobs.filter(x=>x.by===from),()=>({by:to}));await rw('breakdowns',state.breakdowns.filter(x=>x.by===from),()=>({by:to}))}
  else await rw('expenses',state.expenses.filter(x=>x.category===from),()=>({category:to}))}

   {del:name?async()=>{if(used)throw{message:`${used} record${used===1?' uses':'s use'} this ${L.one}. Rename it to another existing name to merge them first, then delete it.`};
      if(items.length<2)throw{message:'Keep at least one item in the list.'};
      await put('settings','main',{...state.settings,[sk]:items.filter(x=>x!==name)});toast('Deleted')}:null,

function saveFile(filename,data){
  const ext=filename.split('.').pop().toLowerCase();
  const mime={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json'}[ext]||'application/octet-stream';
  const blob=new Blob(ext==='csv'?['﻿',data]:[data],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('File downloaded')}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');

/* ---------- data layer ---------- */
function localAdapter(){
  const KEY='maintenance-ledger-local-v1';let mem={};
  try{mem=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(_){}},subs={};
  const rows=n=>Object.entries(mem[n]||{}).map(([id,d])=>({id,data:()=>d})),fire=n=>(subs[n]||[]).forEach(f=>f());
  const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return{collection:n=>({
      onSnapshot(cb){const f=()=>cb({docs:rows(n)});(subs[n]=subs[n]||[]).push(f);f()},
      async add(d){(mem[n]=mem[n]||{})[uid()]=d;persist();fire(n)},
      doc:id=>({async set(d){(mem[n]=mem[n]||{})[id]=d;persist();fire(n)},async delete(){if(mem[n])delete mem[n][id];persist();fire(n)}})}),
    doc:p=>{const[n,i]=p.split('/');return{onSnapshot(cb){const f=()=>{const v=(mem[n]||{})[i];cb({exists:!!v,data:()=>v})};(subs[n]=subs[n]||[]).push(f);f()}}}}}
function supaAdapter(sb){
  const subs={},run=n=>Promise.all((subs[n]||[]).map(f=>f())),bad=r=>{if(r.error)throw r.error};
  const fetchRows=async n=>{const r=await sb.from(n).select('id,data').order('created_at',{ascending:true});bad(r);return r.data||[]};
  const sub=(n,f)=>{(subs[n]=subs[n]||[]).push(f);f()};
  return{run,tables:()=>Object.keys(subs),
    collection:n=>({
      onSnapshot(cb,err){sub(n,async()=>{try{const r=await fetchRows(n);cb({docs:r.map(x=>({id:x.id,data:()=>x.data}))})}catch(e){err&&err(e)}})},
      async add(d){bad(await sb.from(n).insert({data:d}));run(n)},
      doc:id=>({async set(d){bad(await sb.from(n).upsert({id,data:d,updated_at:new Date().toISOString()}));run(n)},
                async delete(){bad(await sb.from(n).delete().eq('id',id));run(n)}})}),
    doc:p=>{const[n,i]=p.split('/');return{onSnapshot(cb,err){sub(n,async()=>{try{const r=await sb.from(n).select('id,data').eq('id',i).maybeSingle();bad(r);cb({exists:!!r.data,data:()=>r.data&&r.data.data})}catch(e){err&&err(e)}})}}}}}

  db.doc('settings/main').onSnapshot(s=>{if(s.exists)state.settings={...state.settings,...s.data()};if(!state.yearUser)state.year=fyCur();render()},err);
  render()}
function showGate(msg){
  $('#root').hidden=true;const g=$('#gate');g.hidden=false;
  g.innerHTML=`<div class="gate"><div class="gh"><span class="k">Building services</span><h1>Maintenance Ledger</h1></div>
   <form id="loginForm"><p>Sign in with the account created for your team.</p>
   <label class="f"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
   <label class="f"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
   <div class="err" id="gerr" ${msg?'':'hidden'}>${esc(msg||'')}</div>
   <button class="btn primary" type="submit">Sign in</button></form></div>`;
  const e=g.querySelector('input');e&&e.focus()}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const fd=new FormData(e.target),b=e.target.querySelector('[type=submit]');b.disabled=true;
  const r=await state.sb.auth.signInWithPassword({email:fd.get('email').trim(),password:fd.get('password')});
  if(r.error){const el=$('#gerr');el.hidden=false;el.textContent=/invalid/i.test(r.error.message)?'Email or password is not correct.':r.error.message;b.disabled=false}});
function enter(sess){
  if(state.started)return;state.started=true;state.session=sess;state.mode='remote';
  $('#gate').hidden=true;$('#root').hidden=false;
  const db=supaAdapter(state.sb);attach(db);
  try{state.sb.channel('ml-changes').on('postgres_changes',{event:'*',schema:'public'},p=>db.run(p.table)).subscribe()}catch(_){}
  setInterval(()=>{if(!document.hidden)db.tables().forEach(db.run)},45000)}

/* ---------- start ---------- */
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))state.view=h;
(async()=>{
  const cfg=window.APP_CONFIG||{};
  if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase&&window.supabase.createClient){
    state.sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    const r=await state.sb.auth.getSession();
    state.sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&sess)enter(sess);if(ev==='SIGNED_OUT')location.reload()});
    if(r.data&&r.data.session)enter(r.data.session);else showGate()}
  else{state.mode='local';attach(localAdapter())}
})();
})();
</script>
</body></html>
